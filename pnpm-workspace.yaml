ignoreWorkspaceRootCheck: true

packages:
    - .
    - functions/*

allowBuilds:
    "@parcel/watcher": false
    "@sentry/cli": false
    esbuild: false
    sharp: false
    workerd: false

minimumReleaseAgeExclude:
