services:
    readytogift:
        image: ghcr.io/readytogift/website
        build:
            context: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            CLOUDFLARE: "false"
            DATA_DIR: /data
            # Optional Redis settings, remove if not using Redis
            REDIS_HOST: readytogift-redis
            REDIS_PORT: 6379
        volumes:
            - ./data:/data
        healthcheck:
            test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:4321/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
            interval: 30s
            timeout: 10s
            retries: 3
        ports:
            - "8000:4321"
        # remove if not using Redis
        depends_on:
            - redis
    redis:
        container_name: readytogift-redis
        image: redis:latest@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
        restart: unless-stopped