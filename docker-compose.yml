services:
    readytogift:
        image: ghcr.io/readytogift/website
        build:
            context: .
        restart: unless-stopped
        env_file:
            - .env
        environment:
            CLOUDFLARE: "false"
            DATA_DIR: /data
        volumes:
            - ./data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:4321/health"]
            interval: 30s
            timeout: 10s
            retries: 3
        ports:
            - "8000:4321"
